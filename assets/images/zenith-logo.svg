<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="zenithGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(10, 12)">
    <!-- Outer Hexagon / Shield -->
    <polygon points="48,4 88,26 88,70 48,92 8,70 8,26" fill="url(#zenithGrad)" />
    <polygon points="48,11 81,29 81,67 48,85 15,67 15,29" fill="#ffffff" />
    
    <!-- Stylized 'Z' with Circuit Nodes -->
    <path d="M 28 30 L 68 30 L 30 66 L 70 66" fill="none" stroke="url(#zenithGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="30" r="4" fill="#0284c7" />
    <circle cx="70" cy="66" r="4" fill="#2563eb" />
    <circle cx="49" cy="48" r="3" fill="#1e40af" />
  </g>

  <!-- Brand Typography -->
  <text x="120" y="58" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="#0f172a">
    ZENITH
  </text>
  <text x="268" y="58" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#2563eb">
    SYSTEMS
  </text>
  <text x="121" y="84" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#64748b">
    &amp; SERVICES • COMPUTER SALES &amp; REPAIR
  </text>
  
  <!-- Location Subtext -->
  <text x="121" y="101" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#94a3b8">
    SULUR, COIMBATORE
  </text>
</svg>
