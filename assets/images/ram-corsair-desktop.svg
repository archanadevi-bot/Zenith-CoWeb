<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="corsairBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#corsairBg)" rx="16"/>
  <!-- Desktop RAM Aluminum Heat Spreader -->
  <polygon points="100,120 120,95 480,95 500,120 500,240 100,240" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
  <!-- Heat Dissipation Fins -->
  <line x1="140" y1="105" x2="140" y2="135" stroke="#71717a" stroke-width="3"/>
  <line x1="160" y1="105" x2="160" y2="135" stroke="#71717a" stroke-width="3"/>
  <line x1="180" y1="105" x2="180" y2="135" stroke="#71717a" stroke-width="3"/>
  <line x1="420" y1="105" x2="420" y2="135" stroke="#71717a" stroke-width="3"/>
  <line x1="440" y1="105" x2="440" y2="135" stroke="#71717a" stroke-width="3"/>
  <line x1="460" y1="105" x2="460" y2="135" stroke="#71717a" stroke-width="3"/>
  <!-- Corsair Badge -->
  <rect x="200" y="145" width="200" height="50" rx="4" fill="#18181b" stroke="#eab308" stroke-width="1.5"/>
  <text x="300" y="170" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#eab308" text-anchor="middle">CORSAIR VENGEANCE</text>
  <text x="300" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">LPX 16GB DDR4 3200MHz</text>
  <!-- Gold Pins -->
  <rect x="110" y="240" width="180" height="12" fill="url(#gold)"/>
  <rect x="310" y="240" width="180" height="12" fill="url(#gold)"/>
  <rect x="30" y="30" width="140" height="28" rx="14" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="1.5"/>
  <text x="100" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle">DESKTOP GAMING RAM</text>
  <text x="300" y="365" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Corsair Vengeance LPX 16GB DDR4</text>
  <text x="300" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fde047" text-anchor="middle">3200MHz • Aluminum Heatspreader • XMP 2.0</text>
</svg>
