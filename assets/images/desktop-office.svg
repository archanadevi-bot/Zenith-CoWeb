<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#officeBg)" rx="16"/>
  <!-- Slim Tower -->
  <rect x="180" y="80" width="100" height="230" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="195" y="100" width="70" height="4" fill="#38bdf8"/>
  <circle cx="230" cy="120" r="6" fill="#0284c7"/>
  <rect x="200" y="145" width="60" height="80" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- 22 Inch Monitor -->
  <rect x="300" y="80" width="180" height="125" rx="4" fill="#020617" stroke="#475569" stroke-width="3"/>
  <rect x="306" y="86" width="168" height="113" rx="2" fill="#0f172a"/>
  <polygon points="360,205 420,205 430,235 350,235" fill="#334155"/>
