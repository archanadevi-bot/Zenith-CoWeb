  <text x="90" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">OFFICE PC BUNDLE</text>
  <text x="300" y="370" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Zenith Essential Office Slim Desktop</text>
  <text x="300" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">Core i3 12th Gen • 8GB RAM • 512GB SSD • Win 11</text>
</svg>
