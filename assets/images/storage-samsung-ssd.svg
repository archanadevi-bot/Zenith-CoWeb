<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ssdM2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#ssdM2Bg)" rx="16"/>
  <!-- M.2 PCB Board -->
  <rect x="120" y="140" width="360" height="130" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <!-- Gold Pins Left Notch -->
  <rect x="120" y="160" width="12" height="40" fill="url(#goldPins)"/>
  <rect x="120" y="210" width="12" height="40" fill="url(#goldPins)"/>
  <!-- Samsung Black Sticker / Heatspreader -->
  <rect x="150" y="150" width="310" height="110" rx="4" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <text x="305" y="188" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">SAMSUNG</text>
  <text x="305" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f59e0b" text-anchor="middle">980 NVMe M.2 SSD 1TB</text>
  <text x="305" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#9ca3af" text-anchor="middle">PCIe 3.0 x4 • Up to 3500 MB/s Read</text>
  <!-- Screw Notch -->
  <circle cx="475" cy="205" r="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <!-- Badges -->
  <rect x="30" y="30" width="100" height="28" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">NVMe SSD</text>
  <text x="300" y="365" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Samsung 980 1TB NVMe M.2 SSD</text>
  <text x="300" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">Ultra-Fast 3500 MB/s • 5 Years Warranty</text>
</svg>
