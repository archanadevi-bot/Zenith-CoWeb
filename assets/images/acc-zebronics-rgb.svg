<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rgbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#rgbBg)" rx="16"/>
  <!-- Gaming Keyboard with Aluminum base -->
  <polygon points="70,110 390,110 375,260 55,260" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <rect x="80" y="120" width="280" height="125" fill="#09090b"/>
  <!-- Rainbow Backlit Glow -->
  <rect x="85" y="125" width="270" height="115" rx="4" fill="none" stroke="url(#rainbowGrad)" stroke-width="4"/>
  <!-- Gaming Mouse -->
  <path d="M 430 140 C 430 110, 510 110, 510 140 L 520 230 C 520 260, 420 260, 420 230 Z" fill="#18181b" stroke="url(#rainbowGrad)" stroke-width="2.5"/>
  <circle cx="470" cy="185" r="8" fill="#00d2ff"/>
  <rect x="30" y="30" width="150" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="105" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">RGB GAMING COMBO</text>
  <text x="300" y="365" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Zebronics Transformer RGB Combo</text>
  <text x="300" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#c084fc" text-anchor="middle">Aluminum Body • Multicolor Breathing LED • 3200 DPI</text>
</svg>
