<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sodimmPCB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#ramBg)" rx="16"/>
  <!-- SODIMM RAM Board -->
  <rect x="140" y="110" width="320" height="170" rx="6" fill="url(#sodimmPCB)" stroke="#22c55e" stroke-width="2"/>
  <!-- DRAM Memory Chips -->
  <rect x="165" y="130" width="55" height="70" rx="3" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <rect x="235" y="130" width="55" height="70" rx="3" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <rect x="310" y="130" width="55" height="70" rx="3" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <rect x="380" y="130" width="55" height="70" rx="3" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <!-- Crucial Label -->
  <rect x="165" y="210" width="270" height="35" rx="3" fill="#0284c7"/>
  <text x="300" y="233" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">Crucial 8GB DDR4-3200 SODIMM</text>
  <!-- Gold Connectors Bottom -->
  <rect x="155" y="270" width="130" height="10" fill="url(#gold)"/>
  <rect x="315" y="270" width="130" height="10" fill="url(#gold)"/>
  <rect x="30" y="30" width="120" height="28" rx="14" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <text x="90" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">LAPTOP DDR4 RAM</text>
  <text x="300" y="365" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Crucial 8GB DDR4 3200MHz Laptop RAM</text>
  <text x="300" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#4ade80" text-anchor="middle">3200MHz CL22 • Lifetime Warranty</text>
</svg>
