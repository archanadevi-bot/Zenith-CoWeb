<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="routerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#routerBg)" rx="16"/>
  <!-- 4 External Antennas -->
  <line x1="160" y1="60" x2="180" y2="180" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="40" x2="250" y2="180" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="350" y1="40" x2="350" y2="180" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="440" y1="60" x2="420" y2="180" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
  <!-- Router Curved Body -->
  <rect x="140" y="170" width="320" height="90" rx="16" fill="#09090b" stroke="#334155" stroke-width="2"/>
  <!-- Diamond Texture Center -->
  <polygon points="300,185 340,215 300,245 260,215" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5"/>
  <text x="300" y="220" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle">TP-LINK</text>
  <!-- Green LEDs -->
  <circle cx="200" cy="245" r="3" fill="#22c55e"/>
  <circle cx="220" cy="245" r="3" fill="#22c55e"/>
  <circle cx="240" cy="245" r="3" fill="#22c55e"/>
  <circle cx="360" cy="245" r="3" fill="#22c55e"/>
  <circle cx="380" cy="245" r="3" fill="#22c55e"/>
  <rect x="30" y="30" width="160" height="28" rx="14" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5"/>
  <text x="110" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">GIGABIT DUAL-BAND</text>
  <text x="300" y="365" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">TP-Link Archer C6 AC1200 Router</text>
  <text x="300" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">1200Mbps • 4 Antennas • Gigabit Ports • MU-MIMO</text>
</svg>
