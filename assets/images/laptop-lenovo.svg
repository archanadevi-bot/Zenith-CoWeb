<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lenovoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1b202e" />
    </linearGradient>
    <linearGradient id="thinkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="tpScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#lenovoBg)" rx="16"/>
  <!-- Screen -->
  <rect x="140" y="70" width="320" height="210" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
  <rect x="150" y="80" width="300" height="180" rx="2" fill="url(#tpScreen)"/>
  <text x="300" y="170" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#f43f5e" text-anchor="middle">ThinkPad</text>
  <circle cx="370" cy="152" r="4" fill="#e11d48"/>
  <rect x="180" y="195" width="240" height="2" fill="#374151"/>
  <text x="300" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="middle">AMD Ryzen 5 • Military Grade E14</text>
  <!-- Base -->
  <polygon points="100,285 500,285 460,320 140,320" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <!-- Red TrackPoint -->
  <circle cx="300" cy="296" r="3.5" fill="#e11d48"/>
  <rect x="255" y="306" width="90" height="10" rx="2" fill="#27272a"/>
  <!-- Badges -->
  <rect x="30" y="30" width="120" height="28" rx="14" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1.5"/>
  <text x="90" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">LENOVO THINKPAD</text>
  <text x="300" y="375" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Lenovo ThinkPad E14 Gen 4</text>
  <text x="300" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fb7185" text-anchor="middle">AMD Ryzen 5 • 16GB RAM • 512GB SSD</text>
</svg>
